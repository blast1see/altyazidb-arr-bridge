name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find altyazidb-arr-bridge-chrome-0.1.0/src \
               altyazidb-arr-bridge-firefox-0.1.0/src \
               tampermonkey \
               -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Parse manifests
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('altyazidb-arr-bridge-chrome-0.1.0/manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('altyazidb-arr-bridge-firefox-0.1.0/manifest.json', 'utf8'))"

      - name: Lint Firefox extension
        run: npx --yes web-ext@latest lint --source-dir altyazidb-arr-bridge-firefox-0.1.0 --self-hosted
