name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run fixtures and mock API tests
        run: npm test

      - name: Verify manifests and mirrored sources
        run: npm run package:verify

      - name: Lint Firefox extension
        run: npm run lint:firefox
